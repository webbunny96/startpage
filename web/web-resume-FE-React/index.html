<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./main.css">
    <title>Resume</title>
</head>
<body>
    <aside class="left-side-block">
        <picture id="photoContainer">
            <!-- Photo will be loaded from JSON -->
        </picture>
        <section class="contacts">
            <h3 id="contactsTitle">CONTACTS</h3>
            <ul id="contactsList">
                <!-- Contacts will be loaded from JSON -->
            </ul>
        </section>
        <section class="languages">
            <h3 id="languagesTitle">LANGUAGES</h3>
            <ul id="languagesList">
                <!-- Languages will be loaded from JSON -->
            </ul>
        </section>
        <section class="skills">
            <h3 id="skillsTitle">SKILLS</h3>
            <ul id="skillsList">
                <!-- Skills will be loaded from JSON -->
            </ul>
        </section>
        <section class="my-site">
            <h3 id="linkTreeTitle">Link Tree</h3>
            <ul id="linkTree">
                <!-- Skills will be loaded from JSON -->
            </ul>
        </section>
    </aside>
    
    <main class="content">
        <div class="header-information">
            <h1 id="personName">Zaitsev Maksym</h1>
            <h2 id="personPosition">FRONTEND DEVELOPER</h2>
            <div>
                <img src="./img/placeholder.png" alt="location icon" /> 
                <span id="personLocation">Ukraine, Dnipro</span>
                <img src="./img/man.png" alt="age icon" /> 
                Age: <span class="old"></span> years
            </div>
        </div>
        
        <section class="work-experience">
            <h3>
                <span id="experienceTitle">WORK EXPERIENCE</span>
                <span class="line"></span>
                <img src="./img/businessman.png" alt="work experience icon">
            </h3>
            <div id="experienceList">
                <!-- Experience will be loaded from JSON -->
            </div>
        </section>
        
        <section class="education">
            <h3>
                <span id="educationTitle">EDUCATION</span>
                <span class="line"></span>
                <img src="./img/graduation-cap.png" alt="education icon">
            </h3>
            <div id="educationList">
                <!-- Education will be loaded from JSON -->
            </div>
        </section>
        
        <section class="courses">
            <h3>
                <span id="coursesTitle">COURSES</span>
                <span class="line"></span>
                <img src="./img/online-learning.png" alt="courses icon">
            </h3>
            <div id="coursesList">
                <!-- Courses will be loaded from JSON -->
            </div>
        </section>
        
        <section class="about-me">
            <h3>
                <span id="aboutTitle">ABOUT ME</span>
                <span class="line"></span>
                <img src="./img/info.png" alt="about me icon">
            </h3>
            <p id="aboutText">My name is Maxim. I have over 7 years of experience in web development...</p>
        </section>
    </main>
    
    <script src="./main.js"></script>
</body>
</html>
